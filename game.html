<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Who's faster?</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
    </style>
    <script type="module" src="/build/frontend/game.js" defer></script>
  </head>
  <body>
    <div
      id="overlay"
      style="
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2;
      "
    >
      <h3 id="countDown" style="color: white">You're up! 3</h3>
    </div>
    <div
      style="
        position: absolute;
        left: 0%;
        right: 0%;
        top: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      "
    >
      <div
        style="
          display: flex;
          flex-direction: column;
          gap: 10px;
          width: auto;
          justify-content: center;
          align-items: center;
        "
      >
        <h3>DUEL</h3>
        <div style="display: flex; justify-content:center; display: flex; align-content: center; gap: 8px; width:316px">
          <div
            style="
              display: flex;
              justify-content: center;
              flex-direction: column;
              align-items: end;
              gap: 10px;
            "
          >
            <h4 aria-label="1st"></h4>
            <div
              id="heartWrap1"
              style="display: flex; flex-direction: row; gap: 10px"
            ></div>
          </div>
          <span>VS</span>
          <div
            style="
              display: flex;
              justify-content: center;
              flex-direction: column;
              align-items: start;
              gap: 10px;
            "
          >
            <h4 aria-label="2nd"></h4>
            <div
              id="heartWrap2"
              style="display: flex; flex-direction: row; gap: 10px"
            ></div>
          </div>
        </div>
        <h5 id="roundCount">Rounds starting soon...</h5>
      </div>
    </div>
    <div
      style="
        width: 100%;
        height: 100vh;
        justify-content: space-between;
        display: flex;
        align-items: center;
      "
    >
      <span style="margin-left: 20px" aria-label="1st"></span>
      <div
        style="
          position: fixed;
          right: 50%;
          left: 50%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
        "
      >
        <div
          style="
            background-color: grey;
            height: 50px;
            border-radius: 200px;
            min-width: 50px;
          "
          id="circle"
        ></div>
      </div>
      <span style="margin-right: 20px" aria-label="2nd"></span>
      <div
        style="
          width: 100%;
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          display: flex;
          flex-direction: row;
          justify-content: center;
          padding-top: 20px;
          padding-bottom: 20px;
        "
      >
        <button id="startButton">Start</button>
      </div>
    </div>
    <div
      style="
        display: flex;
        flex-direction: row;
        position: fixed;
        bottom: 4px;
        left: 4px;
      "
    >
      <h5>Don't refresh the page for best experience.</h5>
    </div>
  </body>
</html>
